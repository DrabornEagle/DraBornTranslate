name: GameTranslator
options:
  bundleIdPrefix: com.gametranslator
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.8.50"
    CURRENT_PROJECT_VERSION: "18050"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    # libchiaki ve bağımlılıkları yalnız Apple Silicon için derleniyor.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
packages:
  GameTranslatorCore:
    path: ../core
  RemotePlay:
    path: ../remoteplay
  # iPhone uygulamasının yerel katmanı: PS5/Xbox oturumu, okuma, çeviri, TV sunucusu ve TV kurulumu (macOS'ta da derlenir).
  GTNative:
    path: ../mobile/ios/GTNative
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  GameTranslator:
    type: application
    platform: macOS
    sources:
      - GameTranslator
      # Tasarım değerleri: Windows sürümüyle ortak tek kaynak.
      - path: ../design/tokens.json
        buildPhase: resources
      # Oyun paketleri (Windows'takilerle aynı dosyalar) ve ikinci ekran sayfası.
      - path: ../windows/src/GameTranslator.Core/Resources/packs
        type: folder
        buildPhase: resources
      - path: ../windows/src/GameTranslator.Core/Resources/second-screen.html
        buildPhase: resources
      # TV uygulaması paketleri ve Samsung sertifika zinciri (Android ve iPhone ile aynı dosyalar).
      - path: ../mobile/android/app/src/main/assets/tv-app
        type: folder
        buildPhase: resources
      - path: ../mobile/android/app/src/main/assets/samsung-ca
        type: folder
        buildPhase: resources
      # Samsung ve Android TV kurulum yardımcısı (scripts/build-tv-helper.sh üretir, package-mac.sh imzalar).
      - path: ../dist/tv-helper/gametranslator-tv-helper
        optional: true
        buildPhase:
          copyFiles:
            destination: executables
      # Türkçe dublajın ses motoru (scripts/fetch-pocket-tts.sh indirir, package-mac.sh imzalar).
      - path: ../dist/tts/pocket-tts
        optional: true
        buildPhase:
          copyFiles:
            destination: executables
    dependencies:
      - package: GameTranslatorCore
      - package: RemotePlay
      - package: GTNative
      - package: Sparkle
    info:
      path: GameTranslator/Info.plist
      properties:
        CFBundleDisplayName: GameTranslator
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: GameTranslator finds your PS5 and TV on the local network to send translated subtitles.
        NSCameraUsageDescription: GameTranslator reads the picture from your capture card to translate the game's subtitles.
        NSHumanReadableCopyright: AGPL-3.0. Uses chiaki-ng (AGPL-3.0).
        # Son sürümün appcast.xml bağlantısı (GitLab sürüm kalıcı adresi; ayrıntı: scripts/publish-gitlab-mac.py).
        SUFeedURL: https://gitlab.com/sefflex/GameTranslator/-/releases/permalink/latest/downloads/appcast.xml
        SUPublicEDKey: DNirrGdrv4TKJbTVRaZ2pbZAihELgIOuifDeolvDBas=
        SUEnableAutomaticChecks: true
    entitlements:
      path: GameTranslator/GameTranslator.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gametranslator.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GameTranslatorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GameTranslatorTests
    dependencies:
      - target: GameTranslator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gametranslator.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GameTranslator.app/Contents/MacOS/GameTranslator"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  GameTranslator:
    build:
      targets:
        GameTranslator: all
        GameTranslatorTests: [test]
    test:
      targets:
        - GameTranslatorTests
