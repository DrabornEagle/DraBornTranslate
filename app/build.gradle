plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def targetAbi = providers.gradleProperty('targetAbi').getOrElse('arm64-v8a')
def llamaSourceDir = providers.gradleProperty('llamaSourceDir').orNull

android {
    namespace 'com.draborneagle.draborntranslate'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.draborneagle.draborntranslate'
        minSdk 29
        targetSdk 35
        versionCode 9
        versionName '0.4.0'
        ndk { abiFilters targetAbi }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                if (llamaSourceDir != null) arguments "-DLLAMA_SOURCE_DIR=${file(llamaSourceDir).absolutePath}"
                targets 'draborn_local'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
