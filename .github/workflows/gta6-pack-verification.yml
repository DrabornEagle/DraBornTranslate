name: GTA 6 Türkçe paketi · gerçek içerik kontrolü

on:
  pull_request:
    paths:
      - 'scripts/verify_gta6_pack.py'
      - '.github/workflows/gta6-pack-verification.yml'
      - 'app/src/main/java/com/draborneagle/draborntranslate/Gta6PackInstaller.kt'
  push:
    branches: [main]
    paths:
      - 'scripts/verify_gta6_pack.py'
      - '.github/workflows/gta6-pack-verification.yml'
      - 'app/src/main/java/com/draborneagle/draborntranslate/Gta6PackInstaller.kt'
  workflow_dispatch:
  schedule:
    - cron: '49 4 * * *'

permissions:
  contents: read

jobs:
  verify-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the key normalization and synthetic pack
        run: python scripts/verify_gta6_pack.py
      - name: Download and inspect GTA 6 Turkish pack without redistributing it
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            python scripts/verify_gta6_pack.py --live | tee "$RUNNER_TEMP/gta6-verification.json.txt"
          else
            python scripts/verify_gta6_pack.py --live --temp-archive "$RUNNER_TEMP/gta6-pack.json.gz" | tee "$RUNNER_TEMP/gta6-verification.json.txt"
          fi
          {
            echo "### GTA 6 Türkçe paket denetimi"
            echo "Canlı dosya: manifest, SHA-256, satır sayısı ve Kolt & Associates: anahtarı kontrol edildi."
            echo "Çeviri metinleri hiçbir yere yayımlanmadı."
            echo "\`\`\`"
            cat "$RUNNER_TEMP/gta6-verification.json.txt"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        if: github.event_name != 'schedule'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name != 'schedule'
      - uses: android-actions/setup-android@v4
        if: github.event_name != 'schedule'
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Run Android JVM pipeline against the real Turkish pack
        if: github.event_name != 'schedule'
        env:
          DBT_GTA6_ARCHIVE: ${{ runner.temp }}/gta6-pack.json.gz
        run: |
          ./gradlew --no-daemon -PtargetAbi=arm64-v8a :app:testDebugUnitTest --tests com.draborneagle.draborntranslate.Gta6LivePackIntegrationTest
      - name: Remove local GTA 6 test data
        if: always()
        run: rm -f "$RUNNER_TEMP/gta6-pack.json.gz"
