name: GTA 6 Türkçe paketi · gerçek içerik kontrolü

on:
  pull_request:
    paths:
      - 'scripts/verify_gta6_pack.py'
      - '.github/workflows/gta6-pack-verification.yml'
      - 'app/src/main/java/com/draborneagle/draborntranslate/Gta6PackInstaller.kt'
  push:
    branches: [main]
    paths:
      - 'scripts/verify_gta6_pack.py'
      - '.github/workflows/gta6-pack-verification.yml'
      - 'app/src/main/java/com/draborneagle/draborntranslate/Gta6PackInstaller.kt'
  workflow_dispatch:
  schedule:
    - cron: '49 4 * * *'

permissions:
  contents: read

jobs:
  verify-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the key normalization and synthetic pack
        run: python scripts/verify_gta6_pack.py
      - name: Download and inspect GTA 6 Turkish pack without redistributing it
        run: |
          set -euo pipefail
          python scripts/verify_gta6_pack.py --live | tee "$RUNNER_TEMP/gta6-verification.json.txt"
          {
            echo "### GTA 6 Türkçe paket denetimi"
            echo "Canlı dosya: manifest, SHA-256, satır sayısı ve Kolt & Associates: anahtarı kontrol edildi."
            echo "Çeviri metinleri hiçbir yere yayımlanmadı."
            echo "\`\`\`"
            cat "$RUNNER_TEMP/gta6-verification.json.txt"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
