name: DraBornTranslate v0.7.2 · production-signed Android release (manual)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/RELEASE-v0.7.2.md']

concurrency:
  group: draborntranslate-signed-v0.6-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  signed-android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Check signing secrets
        env:
          DRABORN_KEYSTORE_B64: ${{ secrets.DRABORNTRANSLATE_KEYSTORE_BASE64 }}
          DRABORN_KEYSTORE_PASSWORD: ${{ secrets.DRABORNTRANSLATE_KEYSTORE_PASSWORD }}
          DRABORN_KEY_ALIAS: ${{ secrets.DRABORNTRANSLATE_KEY_ALIAS }}
          DRABORN_KEY_PASSWORD: ${{ secrets.DRABORNTRANSLATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DRABORN_KEYSTORE_B64"
          test -n "$DRABORN_KEYSTORE_PASSWORD"
          test -n "$DRABORN_KEY_ALIAS"
          test -n "$DRABORN_KEY_PASSWORD"
          umask 077
          printf '%s' "$DRABORN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/draborn-signing.jks"
          echo "DRABORN_KEYSTORE_FILE=$RUNNER_TEMP/draborn-signing.jks" >> "$GITHUB_ENV"
      - name: Verify the actual GTA 6 Turkish pack before releasing
        run: |
          python3 scripts/verify_gta6_pack.py
          python3 scripts/verify_gta6_pack.py --live
      - name: Test and build signed APK
        env:
          DRABORN_KEYSTORE_PASSWORD: ${{ secrets.DRABORNTRANSLATE_KEYSTORE_PASSWORD }}
          DRABORN_KEY_ALIAS: ${{ secrets.DRABORNTRANSLATE_KEY_ALIAS }}
          DRABORN_KEY_PASSWORD: ${{ secrets.DRABORNTRANSLATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -PtargetAbi=arm64-v8a :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DraBornTranslate-v0.7.2-Android-arm64.apk
      - name: Verify APK signature and build version
        run: |
          set -euo pipefail
          APK="dist/DraBornTranslate-v0.7.2-Android-arm64.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='7' versionName='0.7.2'"
          curl --retry 3 --fail --location             "https://github.com/DrabornEagle/DraBornTranslate/releases/download/v0.4.11/DraBornTranslate-v0.4.11-Android-arm64.apk"             --output "$RUNNER_TEMP/previous-release.apk"
          OLD_CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/previous-release.apk" | awk -F ': ' '/Signer #1 certificate SHA-256 digest/ { print $2; exit }')
          NEW_CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk -F ': ' '/Signer #1 certificate SHA-256 digest/ { print $2; exit }')
          if [[ -z "$OLD_CERT" || -z "$NEW_CERT" || "$OLD_CERT" != "$NEW_CERT" ]]; then
            echo "::error::Release certificate mismatch. Publishing stopped."
            exit 1
          fi
          (cd dist && sha256sum DraBornTranslate-v0.7.2-Android-arm64.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: DraBornTranslate-v0.7.2-signed-arm64
          path: dist/
          if-no-files-found: error
      - name: Publish verified v0.7.2 preview to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.DRABORNTRANSLATE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "Missing DRABORNTRANSLATE_RELEASE_TOKEN"; exit 1; }
          if gh release view v0.7.2 >/dev/null 2>&1; then
            echo "Release v0.7.2 already exists; refusing to overwrite."
            exit 1
          fi
          gh release create v0.7.2 \
            dist/DraBornTranslate-v0.7.2-Android-arm64.apk \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "DraBornTranslate v0.7.2 · Live Stream Translate · İmzalı Android" \
            --prerelease \
            --notes-file docs/RELEASE-v0.7.2.md
