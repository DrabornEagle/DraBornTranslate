          python3 - <<'RESTORE'
          import gzip
          import os
          import struct
          from hashlib import sha256
          from pathlib import Path

          original = Path("incoming/app-release-unsigned.apk").read_bytes()
          if sha256(original).hexdigest() != "500844001af9fa6636c88bb65686c2b711fa8a845f5e9653014e029d188ad0a6":
              raise SystemExit("Unexpected source artifact")
          target = Path("release-assets", os.environ["APK"])
          check = sha256()
          view = memoryview(original)
          with gzip.open("layout.gz", "rb") as layout, target.open("wb") as apk:
              while header := layout.read(8):
                  offset, size = struct.unpack("<iI", header)
                  if offset == -1:
                      part = layout.read(size)
                  elif 0 <= offset <= len(original) - size:
                      part = view[offset:offset + size]
                  else:
                      raise SystemExit("Invalid source range")
                  if len(part) != size:
                      raise SystemExit("Incomplete APK")
                  check.update(part)
                  apk.write(part)
          if check.hexdigest() != os.environ["APK_SHA256"]:
              raise SystemExit("Signed APK digest mismatch")
          RESTORE
          java -jar incoming/apksigner.jar verify --print-certs "release-assets/$APK" |
