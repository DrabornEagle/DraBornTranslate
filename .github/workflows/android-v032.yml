name: DraBornTranslate v0.3.2 Android
on:
  push:
    branches: [build/draborntranslate-v0.3.2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test, build and verify the APK
        run: |
          bash ./gradlew --no-daemon -PtargetAbi=arm64-v8a :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          mkdir -p dist
          apk=dist/DraBornTranslate-v0.3.2-Android-arm64.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -E '^package:|^native-code:'
          sha256sum "$apk"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/DraBornTranslate-v0.3.2-Android-arm64.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
