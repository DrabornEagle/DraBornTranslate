name: DraBornTranslate v0.6.2 · public DEBUG preview APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-preview-v0.6.2.yml'
      - 'docs/RELEASE-v0.6.2.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draborntranslate-v0.6.2-debug-preview
  cancel-in-progress: false

jobs:
  debug-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Test, lint, and build DEBUG-signed APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -PtargetAbi=arm64-v8a :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DraBornTranslate-v0.6.2-TEST-DEBUG-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "dist/DraBornTranslate-v0.6.2-TEST-DEBUG-arm64.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "dist/DraBornTranslate-v0.6.2-TEST-DEBUG-arm64.apk" |
            grep -F "versionCode='3' versionName='0.6.2'"
          (cd dist && sha256sum DraBornTranslate-v0.6.2-TEST-DEBUG-arm64.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: DraBornTranslate-v0.6.2-TEST-DEBUG-arm64
          path: dist/
          if-no-files-found: error
      - name: Publish clearly-labelled preview, not a production release
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.6.2-preview-debug >/dev/null 2>&1; then
            echo "Preview already exists, refusing to overwrite."
            exit 1
          fi
          gh release create v0.6.2-preview-debug \
            dist/DraBornTranslate-v0.6.2-TEST-DEBUG-arm64.apk \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "DraBornTranslate v0.6.2 · TEST/DEBUG APK (üretim imzalı değil)" \
            --prerelease \
            --notes-file docs/RELEASE-v0.6.2.md
