      - name: Attach the files to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/458333688")"
          jq -e '.draft == true and .tag_name == "v5.5" and .target_commitish == "codex/v5.5"' <<< "$draft" > /dev/null
          apk=DraBornTranslate-v5.5-Android-arm64.apk
          for name in "$apk" "$apk.sha256"; do
            checksum="$(sha256sum "release-assets/$name" | cut -d " " -f 1)"
            known="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest // "unverified"' <<< "$draft")"
            if [[ -n "$known" ]]; then
              [[ "$known" == "sha256:$checksum" ]]
              continue
            fi
            content_type=application/octet-stream
            if [[ "$name" == "$apk" ]]; then content_type=application/vnd.android.package-archive; fi
            gh api --method POST \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/458333688/assets?name=$name" \
              --header "Content-Type: $content_type" --input "release-assets/$name" --jq '{name,size,state,digest}'
          done
