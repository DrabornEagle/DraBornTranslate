name: DraBornTranslate v0.6.3 · Android signed DEBUG preview

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-preview-v0.6.3.yml'
      - 'docs/RELEASE-v0.6.3.md'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android-preview-v0.6.3.yml'
      - 'docs/RELEASE-v0.6.3.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draborn-v0.6.3-preview
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Test, lint and build signed DEBUG preview
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -PtargetAbi=arm64-v8a :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DraBornTranslate-v0.6.3-Android-arm64-DEBUG.apk
          APK="dist/DraBornTranslate-v0.6.3-Android-arm64-DEBUG.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" |
            grep -F "versionCode='4' versionName='0.6.3'"
          (cd dist && sha256sum "DraBornTranslate-v0.6.3-Android-arm64-DEBUG.apk" > SHA256SUMS.txt)
      - name: Upload APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: DraBornTranslate-v0.6.3-Android-arm64-DEBUG
          path: dist/
          if-no-files-found: error
          retention-days: 30
