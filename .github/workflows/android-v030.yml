name: DraBornTranslate v0.3.0 APK
on:
  push:
    branches: [build/draborntranslate-v0.3.0]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: DraBornTranslate-v0.3.0-Android-arm64
          run-id: '44800143516'
          github-token: ${{ github.token }}
          path: dist
      - name: Verify the signed APK
        run: |
          apk=dist/DraBornTranslate-v0.3.0-Android-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          sha256sum "$apk"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/DraBornTranslate-v0.3.0-Android-arm64.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
