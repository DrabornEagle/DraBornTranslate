name: Upstream GameTranslator · automatic source mirror

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_gametranslator.py'
      - '.github/workflows/gametranslator-upstream.yml'

permissions:
  contents: write

concurrency:
  group: gametranslator-source-mirror
  cancel-in-progress: false

jobs:
  source-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch latest signed-off upstream source tag
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/sync_gametranslator.py
      - name: Validate source snapshot without compiling upstream
        shell: bash
        run: |
          set -euo pipefail
          test -s upstream/GameTranslator/LICENSE
          test -s upstream/GameTranslator/NOTICE
          python -m json.tool upstream/GameTranslator/source-version.json > /dev/null
          python -c "import ast,pathlib; ast.parse(pathlib.Path('scripts/sync_gametranslator.py').read_text())"
          git diff --check
      - name: Commit upstream-only sources to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A upstream/GameTranslator
          if git diff --cached --quiet; then
            echo "GameTranslator sources already match official GitLab release"
          else
            git commit -m "chore(upstream): mirror official GameTranslator tagged source"
            git push origin HEAD:main
          fi
          echo "### GameTranslator source sync" >> "$GITHUB_STEP_SUMMARY"
          echo "Only licensed source snapshots, licence notices and the upstream commit are mirrored." >> "$GITHUB_STEP_SUMMARY"
          echo "Third-party binaries and copyrighted game packs are excluded. Android app integration and signed release must be reviewed and tested separately." >> "$GITHUB_STEP_SUMMARY"
