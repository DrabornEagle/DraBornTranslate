name: Upstream GameTranslator source sync

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_gametranslator.py'
      - '.github/workflows/gametranslator-upstream.yml'

permissions:
  contents: write

concurrency:
  group: gametranslator-source-sync
  cancel-in-progress: false

jobs:
  source-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore source review branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin refs/heads/automation/gametranslator-upstream; then
            git fetch origin automation/gametranslator-upstream
            git switch -C automation/gametranslator-upstream FETCH_HEAD
          else
            git switch -c automation/gametranslator-upstream
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show origin/main:scripts/sync_gametranslator.py > "$RUNNER_TEMP/sync_gametranslator.py"
      - name: Import latest tagged source (never another application's APK)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python "$RUNNER_TEMP/sync_gametranslator.py"
      - name: Validate upstream licence and metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s upstream/GameTranslator/LICENSE
          test -s upstream/GameTranslator/NOTICE
          python -m json.tool upstream/GameTranslator/source-version.json > /dev/null
          python -c "import ast,pathlib; ast.parse(pathlib.Path('scripts/sync_gametranslator.py').read_text())"
          git diff --check
      - name: Push source changes to the existing review PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A upstream/GameTranslator
          if git diff --cached --quiet; then
            echo "Official tagged sources are already up to date"
          else
            git commit -m "chore(upstream): update GameTranslator licensed sources"
            git push -u origin HEAD:refs/heads/automation/gametranslator-upstream
          fi
          echo "### GameTranslator upstream source" >> "$GITHUB_STEP_SUMMARY"
          echo "Tagged source changes are staged for human review in the automation branch." >> "$GITHUB_STEP_SUMMARY"
          echo "Review: https://github.com/DrabornEagle/DraBornTranslate/pull/4" >> "$GITHUB_STEP_SUMMARY"
          echo "If that PR is closed or merged, GitHub Actions is not allowed to create a replacement PR until repository Actions permission is enabled." >> "$GITHUB_STEP_SUMMARY"
